name: azure-dev

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# Serialize deploys: azd up against the same environment is not safe to run
# concurrently (two `docker build`s racing on the runner, two `azd up`s
# racing on the same Azure resources). Merges landing seconds apart used to
# fire overlapping runs that starved/killed each other's builds. Queue
# instead of canceling so every merge to main still gets deployed, in order.
concurrency:
  group: azure-dev-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup azd
        run: curl -fsSL https://aka.ms/install-azd.sh | bash

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: azd auth login
        run: |
          azd auth login \
            --client-id "${{ vars.AZURE_CLIENT_ID }}" \
            --federated-credential-provider github \
            --tenant-id "${{ secrets.AZURE_TENANT_ID }}"

      - name: Configure azd env
        run: |
          azd env select "${{ vars.AZURE_ENV_NAME }}" || azd env new "${{ vars.AZURE_ENV_NAME }}"

          # azd infrastructure variables (subscription, location, RG)
          azd env set AZURE_SUBSCRIPTION_ID "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          azd env set AZURE_TENANT_ID "${{ secrets.AZURE_TENANT_ID }}"
          azd env set AZURE_LOCATION "${{ vars.AZURE_LOCATION }}"
          azd env set AZURE_RESOURCE_GROUP "${{ vars.AZURE_RESOURCE_GROUP }}"

          # Bicep parameters — use infra.parameters.* so azd resolves them without prompting
          azd env config set infra.parameters.environmentName "${{ vars.AZURE_ENV_NAME }}"
          azd env config set infra.parameters.appEnvironment "${{ vars.AZURE_ENV_NAME }}"
          azd env config set infra.parameters.apiImageTag "${{ github.sha }}"
          azd env config set infra.parameters.workerImageTag "${{ github.sha }}"
          azd env config set infra.parameters.azureOpenAiEndpoint "${{ vars.AZURE_OPENAI_ENDPOINT }}"
          azd env config set infra.parameters.azureOpenAiEmbeddingsDeployment "${{ vars.AZURE_OPENAI_EMBEDDINGS_DEPLOYMENT }}"
          azd env config set infra.parameters.azureOpenAiChatDeployment "${{ vars.AZURE_OPENAI_CHAT_DEPLOYMENT }}"
          azd env config set infra.parameters.answerRefusalMinScore "${{ vars.ANSWER_REFUSAL_MIN_SCORE }}"
          azd env config set infra.parameters.azureOpenAiApiVersion "${{ vars.AZURE_OPENAI_API_VERSION }}"
          azd env config set infra.parameters.cosmosEndpoint "${{ vars.COSMOS_ENDPOINT }}"
          azd env config set infra.parameters.cosmosDatabase "${{ vars.COSMOS_DATABASE }}"
          azd env config set infra.parameters.azureOpenAiApiKey "${{ secrets.AZURE_OPENAI_API_KEY }}"
          azd env config set infra.parameters.cosmosKey "${{ secrets.COSMOS_KEY }}"

      - name: Deploy
        run: azd up --no-prompt
